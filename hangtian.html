<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .container {
      position: relative;
      display: flex;
      width: 600px;
      height: 100%;
      justify-content: center
    }

    .logo-area {
      position: absolute;
      left: 150px;
      top: 200px;
    }

    .logo1 {
      position: absolute;
      width: 300px;
    }

    .logo1 img {
      width: 300px;
    }

    .logo2 {
      width: 60px;
      position: absolute;
      left: 120px;
      top: 190px;
    }

    .logo2 img {
      width: 60px;
    }

    /* video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    } */
  </style>
</head>

<body>
  <video controls class="video" autoplay loop class="video" width="600">
        <source src="./wave.mp4" type="video/mp4">
      </video>
  <div class="container">
    <div>
      <video controls class="video" autoplay loop class="video" width="600">
        <source src="./wave.mp4" type="video/mp4">
      </video>
    </div>
    <div class="logo-area">
      <div class="logo1">
        <img src="./logo01.png">
      </div>
      <div class="logo2">
        <img src="./logo02.png">
      </div>
    </div>
  </div>

</body>

</html>
